name = "nzcs-timesheet-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
account_id = "dc50d269d55490062b7b588156ed2fa1"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "nzcs-timesheet"
database_id = "00000000-0000-0000-0000-000000000000"   # replaced with the real id when the database is created
migrations_dir = "migrations"

[triggers]
crons = ["23 14 * * *"]   # daily tidy-up (~3am NZ): removes expired logins

# SETUP_CODE is a Cloudflare secret (wrangler secret put SETUP_CODE), never written here.
